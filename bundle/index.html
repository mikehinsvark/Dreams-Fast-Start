<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <title>DREAMS Cloud 3 Packages | Dreams Fast Start</title>
    <meta name="description" content="Explore DREAMS Cloud 3 service packages, compare included tools, and request a consultation." />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #f7fbfc; }
      body { font-family: Arial, Helvetica, sans-serif; }
      .bundle-shell { min-height: 100vh; }
      .bundle-app { display: block; width: 100%; min-height: 100vh; border: 0; background: #f7fbfc; }
      .loading { min-height: 100vh; display: grid; place-items: center; color: #12324a; font-size: 14px; }
      .fallback { max-width: 680px; margin: 0 auto; padding: 48px 24px; color: #12324a; line-height: 1.6; }
      .fallback a { color: #007d88; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="bundle-shell">
      <div class="loading" id="loading">Loading DREAMS Cloud 3 Packages…</div>
      <iframe id="bundle-app" class="bundle-app" title="DREAMS Cloud 3 Packages" loading="eager" allow="clipboard-write" hidden></iframe>
      <noscript><div class="fallback">JavaScript is required to load the package experience. <a href="https://dreamspack-bundle.manus.space">Open DREAMS Cloud 3 Packages</a>.</div></noscript>
    </main>
    <script>
      (function () {
        const appUrl = new URL("https://dreamspack-bundle.manus.space/");
        const refid = new URLSearchParams(window.location.search).get("refid");
        if (refid && /^[A-Za-z]{2}\d{4}$/.test(refid.trim())) {
          appUrl.searchParams.set("refid", refid.trim().toUpperCase());
        }
        const frame = document.getElementById("bundle-app");
        const loading = document.getElementById("loading");
        frame.src = appUrl.toString();
        frame.addEventListener("load", function () {
          frame.hidden = false;
          loading.remove();
        }, { once: true });
      })();
    </script>
  </body>
</html>
